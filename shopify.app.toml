# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1fcb69bd35b7fa6a5141c2982d9461e4"
application_url = "https://cloudflare-workers-app.kuldeepkumawat.workers.dev"
embedded = true
name = "Cloudflare Workers App"
handle = "cloudflare-workers-app"

[build]
include_config_on_deploy = true
dev_store_url = "order-pause-demo.myshopify.com"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/auth/callback",
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/auth/shopify/callback",
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/api/auth/callback"
]

[pos]
embedded = false
