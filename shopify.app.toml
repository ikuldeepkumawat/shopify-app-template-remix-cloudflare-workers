client_id = "1fcb69bd35b7fa6a5141c2982d9461e4"
name = "Cloudflare Workers App"
application_url = "https://cloudflare-workers-app.kuldeepkumawat.workers.dev"
embedded = true
handle = "cloudflare-app-2"

[build]
dev_store_url = "quickstart-40d2c10b.myshopify.com"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products, write_discounts, read_products, read_discounts"

[auth]
redirect_urls = [
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/auth/callback",
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/auth/shopify/callback",
  "https://cloudflare-workers-app.kuldeepkumawat.workers.dev/api/auth/callback"
]

[pos]
embedded = true
