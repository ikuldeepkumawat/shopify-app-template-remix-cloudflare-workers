query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  # Hamein Shop ka Metafield chahiye, DiscountNode ka nahi
  shop {
    metafield(namespace: "volume_app", key: "config") {
      value
    }
  }
}